# CI für alle TrustyLynx-Backend-Services (Kotlin/Ktor, Gradle, JDK 21).
# Datei ist in allen Service-Repos identisch – Änderungen bitte überall übernehmen.
#
# Läuft bei:
#   - jedem Push (außer auf "deploy" – dort ruft deploy.yml diese CI selbst auf)
#   - jedem Pull Request
#   - manuell über "Run workflow"
#   - als Vorstufe von deploy.yml (workflow_call)

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: JDK 21 einrichten
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      # Cacht Gradle-Abhängigkeiten und prüft, dass gradle-wrapper.jar nicht manipuliert ist.
      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          validate-wrappers: true

      # In manchen Repos ist gradlew ohne Ausführungsrecht eingecheckt.
      - name: gradlew ausführbar machen
        run: chmod +x gradlew

      # "build" = kompilieren + alle Tests (inkl. Testcontainers/Postgres, Docker ist auf dem Runner vorhanden)
      - name: Build & Tests
        run: ./gradlew build --no-daemon --stacktrace

      - name: Fat-JAR bauen
        run: ./gradlew buildFatJar --no-daemon

      - name: Testberichte hochladen
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7
          if-no-files-found: ignore

  docker:
    name: Docker-Image bauen
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Baut das Image wie auf dem Server, pusht aber nichts – stellt nur sicher, dass das Dockerfile funktioniert.
      - name: Image bauen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: ${{ github.event.repository.name }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max